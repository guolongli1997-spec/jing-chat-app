<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#000000" />
		<title>LLM Chat App</title>
		<style>
			:root {
				--primary-color: #3fbf9f;
				--primary-ink: #04120e;
				--bg: #000000;
				--surface: #111413;
				--border-color: #262b29;
				--text-color: #edf2f0;
				--text-light: #7f8b86;
				--user-msg-bg: #edf2f0;
				--user-msg-text: #000000;
				--assistant-msg-bg: #111413;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				-webkit-tap-highlight-color: transparent;
			}

			html {
				height: 100%;
				background: var(--bg);
				color-scheme: dark;
			}

			body {
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
					Cantarell, "Noto Sans Bengali", sans-serif;
				font-size: 16px;
				line-height: 1.5;
				color: var(--text-color);
				background: var(--bg);
				height: 100vh;
				height: 100dvh;
				max-width: 760px;
				margin: 0 auto;
				display: flex;
				flex-direction: column;
				padding-top: env(safe-area-inset-top, 0px);
				-webkit-text-size-adjust: 100%;
			}

			header {
				flex: none;
				display: flex;
				align-items: center;
				gap: 10px;
				min-height: 44px;
				padding: 0 14px;
				border-bottom: 1px solid var(--border-color);
			}

			.mark {
				width: 22px;
				height: 22px;
				border-radius: 7px;
				background: var(--primary-color);
				color: var(--primary-ink);
				display: grid;
				place-items: center;
				font-weight: 700;
				font-size: 13px;
			}

			h1 {
				font-size: 15px;
				font-weight: 600;
			}

			.chat-container {
				flex: 1;
				min-height: 0;
				display: flex;
				flex-direction: column;
			}

			.chat-messages {
				flex: 1;
				overflow-y: auto;
				overscroll-behavior: contain;
				-webkit-overflow-scrolling: touch;
				padding: 16px 14px;
				display: flex;
				flex-direction: column;
				gap: 14px;
			}

			.message {
				padding: 9px 14px;
				max-width: 88%;
			}

			.message p {
				white-space: pre-wrap;
				margin: 0;
				overflow-wrap: anywhere;
			}

			.user-message {
				background-color: var(--user-msg-bg);
				color: var(--user-msg-text);
				align-self: flex-end;
				border-radius: 18px 18px 4px 18px;
			}

			.assistant-message {
				background-color: var(--assistant-msg-bg);
				border: 1px solid var(--border-color);
				align-self: flex-start;
				border-radius: 18px 18px 18px 4px;
			}

			.assistant-message.error {
				color: #ff6b6b;
				border-color: #ff6b6b;
			}

			/* Space is always reserved, so showing it never shifts the layout */
			.typing-indicator {
				flex: none;
				height: 22px;
				padding: 0 16px;
				font-size: 13px;
				color: var(--text-light);
				visibility: hidden;
			}

			.typing-indicator.visible {
				visibility: visible;
			}

			.message-input {
				flex: none;
				display: flex;
				align-items: flex-end;
				gap: 8px;
				padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
				border-top: 1px solid var(--border-color);
			}

			#user-input {
				flex: 1;
				padding: 10px 16px;
				background: var(--surface);
				color: var(--text-color);
				border: 1px solid var(--border-color);
				border-radius: 22px;
				font-family: inherit;
				font-size: 16px; /* prevents iOS zoom on focus */
				line-height: 1.4;
				resize: none;
				min-height: 44px;
				max-height: 140px;
				outline: none;
			}

			#user-input::placeholder {
				color: var(--text-light);
			}

			#user-input:focus {
				border-color: var(--primary-color);
			}

			#send-button {
				flex: none;
				width: 44px;
				height: 44px;
				display: grid;
				place-items: center;
				background-color: var(--primary-color);
				color: var(--primary-ink);
				border: none;
				border-radius: 50%;
				cursor: pointer;
				touch-action: manipulation;
				-webkit-appearance: none;
				appearance: none;
			}

			#send-button svg {
				width: 20px;
				height: 20px;
			}

			#send-button:disabled {
				opacity: 0.35;
				cursor: not-allowed;
			}

			#send-button:focus-visible {
				outline: 2px solid var(--primary-color);
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<header>
			<div class="mark">A</div>
			<h1>Cloudflare AI Chat</h1>
		</header>

		<div class="chat-container">
			<div id="chat-messages" class="chat-messages">
				<div class="message assistant-message">
					<p>
						Hello! I'm an LLM chat app powered by Cloudflare Workers AI. How can
						I help you today?
					</p>
				</div>
			</div>

			<div class="typing-indicator" id="typing-indicator">
				AI is thinking...
			</div>

			<div class="message-input">
				<textarea
					id="user-input"
					placeholder="Type your message here..."
					rows="1"
				></textarea>
				<button id="send-button" aria-label="Send message" disabled>
					<svg
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2.4"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path d="M12 19V5M5 12l7-7 7 7" />
					</svg>
				</button>
			</div>
		</div>

		<!-- Chat app script -->
		<script src="chat.js"></script>
	</body>
</html>
